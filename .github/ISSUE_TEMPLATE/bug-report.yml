name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Thanks for taking the time to report a bug! Please fill out the form below to help us understand and reproduce the issue.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the application is affected?
      options:
        - Frontend (React/Next.js)
        - Backend (Node.js/Express)
        - API/Database
        - Deployment/Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: "Describe what happened, what you expected to happen, and any relevant context..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & Version
      description: "e.g., Chrome 120.0, Firefox 119.0, Safari 17.0"
      placeholder: "Chrome 120.0"

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "e.g., Windows 11, macOS 14.0, Ubuntu 22.04"
      placeholder: "Windows 11"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, logs, environment details, etc.)
      placeholder: |
        - Screenshots
        - Error logs
        - Environment details
        - Related issues/PRs

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please check the following before submitting
      options:
        - label: I have searched for existing issues and confirmed this is not a duplicate
          required: true
        - label: I have provided all the necessary information to reproduce the issue
          required: true
        - label: I have tested this on the latest version of the application
